; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; The ESP-IDF sources live in ./main (idf_component_register), not the
; PlatformIO-default ./src, so point PlatformIO at the existing layout.
src_dir = main

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = espidf

; matches CONFIG_ESPTOOLPY_FLASHSIZE_4MB / DIO / 40m in ./sdkconfig
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; header-only, pinned to the same tag the old CPMAddPackage() used.
; Custom name "etl" fixes the folder under .pio/libdeps/<env>/ that
; main/CMakeLists.txt points at for its include path.
lib_deps = etl=https://github.com/ETLCPP/etl.git#20.48.0
